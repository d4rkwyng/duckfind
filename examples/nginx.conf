# Example nginx server block for DuckFind.
# Web root is the repo's public/ directory; config.php lives one level up and is
# never exposed. Listens on plain HTTP so vintage browsers can connect directly.

server {
    listen 80;
    server_name duckfind.example;

    root /srv/duckfind/public;
    index index.php;

    # DuckFind has no rewrite needs; serve files, fall back to index.php.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # \.php(/|$), not just \.php$, plus fastcgi_split_path_info: two features
    # rely on an extra path segment after the script name reaching PHP as
    # PATH_INFO -- watch.php's raw stream URL (/watch.php/video.mpg?...,
    # given a real extension so vintage plugins that sniff the URL find one)
    # and map.php's click-to-recentre (/map.php/c/lat/lon/z/mode). Caddy's
    # php_fastcgi splits this automatically; nginx needs it spelled out, or
    # those two requests silently fall through to try_files's /index.php
    # fallback above instead of reaching the intended script.
    location ~ ^(.+\.php)(/.+)?$ {
        try_files $fastcgi_script_name =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Never serve dotfiles.
    location ~ /\. { deny all; }
}
